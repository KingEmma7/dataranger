name: Nightly DataRanger patrol

on:
  schedule:
    - cron: "17 6 * * *" # Every day at 06:17 UTC; adjust for your load time.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DataRanger
        run: python -m pip install dataranger==0.3.0
      - name: Generate demo tables
        run: python examples/scheduled/make_demo_db.py "$RUNNER_TEMP/demo.duckdb"
      - name: Patrol the demo tables
        run: |
          dataranger patrol --db "$RUNNER_TEMP/demo.duckdb" \
            --table transactions --ref-table customers --manifest-table control_totals \
            --category category --out patrol-report
      - name: Check report files
        if: ${{ always() }}
        run: |
          test -s patrol-report/dashboard.html
          test -f patrol-report/audit.jsonl
      - name: Upload the morning report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dataranger-patrol-${{ github.run_id }}
          path: |
            patrol-report/dashboard.html
            patrol-report/audit.jsonl
          if-no-files-found: error
          retention-days: 7
